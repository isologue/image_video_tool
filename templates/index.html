<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoAI画图/视频</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --pink-a: #fff0f5;
            --pink-b: #ffe4ec;
            --pink-text: #9d174d;
            --pink-strong: #be185d;
            --dark-a: #070a0f;
            --dark-b: #10161f;
            --dark-c: #1a2330;
            --cyan: #7dd3fc;
            --blue: #60a5fa;
            --ink: #0f172a;
            --muted: #475569;
            --line: rgba(15, 23, 42, 0.08);
        }
        html { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 90px 20px 20px;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #fff5f7 100%);
            color: var(--ink);
            transition: background 0.55s ease, color 0.35s ease;
        }
        body.mode-grok {
            color: #e2e8f0;
            background:
                radial-gradient(circle at top left, rgba(34, 211, 238, 0.12), transparent 28%),
                radial-gradient(circle at right 18%, rgba(96, 165, 250, 0.15), transparent 24%),
                radial-gradient(circle at bottom, rgba(125, 211, 252, 0.08), transparent 20%),
                linear-gradient(135deg, var(--dark-a), var(--dark-b) 45%, var(--dark-c));
        }
        body.mode-gpt {
            color: #ebe9fe;
            background:
                radial-gradient(circle at top left, rgba(192, 132, 252, 0.16), transparent 30%),
                radial-gradient(circle at right 18%, rgba(96, 165, 250, 0.13), transparent 24%),
                radial-gradient(circle at bottom, rgba(34, 211, 238, 0.08), transparent 18%),
                linear-gradient(135deg, #050913, #0d1321 45%, #161f31);
        }
        .page { max-width: 1280px; margin: 0 auto; }
        .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 4px; }
        .brand h1 { margin: 0; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.02; letter-spacing: -0.03em; font-weight: 800; }
        .brand p { margin: 6px 0 0; max-width: 760px; color: var(--muted); line-height: 1.6; font-size: 13px; font-weight: 500; }
        body.mode-grok .brand p, body.mode-grok .workspace-meta, body.mode-grok .panel-note, body.mode-grok .status-pill,
        body.mode-gpt .brand p, body.mode-gpt .workspace-meta, body.mode-gpt .panel-note, body.mode-gpt .status-pill { color: #94a3b8; }
        .top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
        .status-pill {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
            background: rgba(255,255,255,0.68); border: 1px solid rgba(15, 23, 42, 0.08); box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            font-size: 12px; font-weight: 600; color: var(--muted); backdrop-filter: blur(10px);
        }
        body.mode-grok .status-pill { background: rgba(8, 15, 28, 0.6); border-color: rgba(125, 211, 252, 0.12); box-shadow: 0 10px 24px rgba(2, 8, 23, 0.2); }
        .hero-shell {
            position: fixed;
            top: 12px;
            left: 50%;
            z-index: 50;
            width: min(1080px, calc(100% - 24px));
            transform: translateX(-50%);
            overflow: hidden;
            border-radius: 20px;
            padding: 8px;
            background: linear-gradient(135deg, rgba(255,255,255,0.82), rgba(255,255,255,0.66));
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
            border: 1px solid rgba(255,255,255,0.82);
            backdrop-filter: blur(14px);
        }
        .hero-shell::before { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(244,114,182,0.08), rgba(34,211,238,0.05), rgba(96,165,250,0.08)); pointer-events: none; }
        body.mode-grok .hero-shell {
            background: linear-gradient(135deg, rgba(9, 15, 26, 0.88), rgba(12, 19, 31, 0.76));
            border-color: rgba(125, 211, 252, 0.12);
            box-shadow: 0 18px 42px rgba(2, 8, 23, 0.28);
        }
        body.mode-gpt .hero-shell {
            background: linear-gradient(135deg, rgba(15, 11, 30, 0.9), rgba(20, 17, 39, 0.78));
            border-color: rgba(192, 132, 252, 0.14);
            box-shadow: 0 18px 42px rgba(15, 23, 42, 0.3);
        }
        .hero-grid {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .switch-btn {
            border: none; border-radius: 999px; padding: 7px 13px; text-align: left; cursor: pointer; position: relative; overflow: hidden;
            transition: transform .22s ease, filter .22s ease, box-shadow .25s ease, border-color .25s ease; min-height: auto;
        }
        .switch-btn:focus-visible { outline: 3px solid rgba(96,165,250,.35); outline-offset: 2px; }
        .switch-btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,0.12), transparent 35%, rgba(255,255,255,0.18)); opacity: 0; transition: opacity .25s ease; pointer-events: none; }
        .switch-btn:hover { transform: translateY(-1px); }
        .switch-btn:hover::after, .switch-btn.active::after { opacity: 1; }
        .switch-btn[data-mode="gemini"] { background: linear-gradient(135deg, var(--pink-a) 0%, var(--pink-b) 100%); color: var(--pink-text); box-shadow: inset 0 0 0 1px rgba(190,24,93,0.08); }
        .switch-btn[data-mode="grok"] { background: linear-gradient(135deg, rgba(10,16,28,0.97), rgba(22,29,41,0.96)); color: #dbeafe; box-shadow: inset 0 0 0 1px rgba(125,211,252,0.12); }
        .switch-btn[data-mode="gpt"] { background: linear-gradient(135deg, rgba(20, 12, 34, 0.98), rgba(24, 32, 52, 0.96)); color: #ede9fe; box-shadow: inset 0 0 0 1px rgba(192,132,252,0.16); }
        .switch-btn.active { transform: translateY(-1px); }
        .switch-btn[data-mode="gemini"].active { box-shadow: 0 10px 24px rgba(244,114,182,0.16), inset 0 0 0 1px rgba(190,24,93,0.12); }
        .switch-btn[data-mode="grok"].active { box-shadow: 0 10px 24px rgba(2,132,199,0.16), inset 0 0 0 1px rgba(125,211,252,0.18); }
        .switch-btn[data-mode="gpt"].active { box-shadow: 0 10px 24px rgba(147,51,234,0.16), inset 0 0 0 1px rgba(192,132,252,0.22); }
        .eyebrow { display:none; }
        .title-row { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:0; }
        .title { display:block; font-size:13px; font-weight:700; line-height:1.06; letter-spacing: -0.01em; }
        .badge { flex-shrink:0; padding:4px 7px; border-radius:999px; font-size:10px; font-weight:700; letter-spacing:.02em; background: rgba(255,255,255,0.45); color: inherit; }
        .switch-btn[data-mode="grok"] .badge { background: rgba(125,211,252,0.12); color: #bfe7ff; }
        .switch-btn[data-mode="gpt"] .badge { background: rgba(192,132,252,0.14); color: #e9d5ff; }
        .desc { display:none; }
        .subline { display:none; }
        .workspace-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 2px 14px; color: var(--muted); font-size: 12px; font-weight: 500; }
        .meta-chip { padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.62); border: 1px solid var(--line); backdrop-filter: blur(10px); }
        body.mode-grok .meta-chip { background: rgba(8, 15, 28, 0.58); border-color: rgba(125, 211, 252, 0.1); }
        body.mode-gpt .meta-chip { background: rgba(15, 12, 28, 0.6); border-color: rgba(192, 132, 252, 0.14); color: #cbd5e1; }
        .viewport { position: relative; min-height: calc(100vh - 240px); border-radius: 28px; overflow: hidden; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12); background: rgba(255,255,255,.26); border: 1px solid rgba(255,255,255,.6); }
        body.mode-grok .viewport { background: rgba(8, 15, 28, 0.36); border-color: rgba(125, 211, 252, 0.08); box-shadow: 0 28px 70px rgba(2, 8, 23, 0.28); }
        body.mode-gpt .viewport { background: rgba(13, 10, 28, 0.4); border-color: rgba(192, 132, 252, 0.12); box-shadow: 0 28px 70px rgba(15, 23, 42, 0.32); }
        .frame {
            width: 100%; height: calc(100vh - 240px); min-height: calc(100vh - 240px); border: none; border-radius: 28px; background: transparent;
            position: absolute; inset: 0; opacity: 0; transform: translateY(16px) scale(.985); filter: blur(10px); pointer-events: none;
            transition: opacity .42s ease, transform .55s ease, filter .55s ease;
        }
        .frame.active { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); pointer-events: auto; }
        .sweep { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: linear-gradient(120deg, rgba(244,114,182,.14), rgba(34,211,238,.14), rgba(96,165,250,.14)); }
        .sweep.run { animation: sweep .72s ease; }
        @keyframes sweep { 0% { opacity: 0; transform: translateX(-8%) scaleX(.96); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateX(8%) scaleX(1.02); } }
        .panel-note { margin-top: 14px; font-size: 13px; color: var(--muted); }
        @media (max-width: 900px) {
            body { padding: 102px 14px 14px; }
            .topbar { flex-direction: column; align-items: stretch; }
            .top-actions { justify-content: flex-start; }
            .hero-shell {
                top: 10px;
                width: calc(100% - 16px);
                padding: 8px;
            }
            .hero-grid { justify-content: flex-start; }
            .brand h1 { font-size: 24px; }
            .brand p { font-size: 12px; }
            .title { font-size: 12px; }
            .viewport, .frame { height: calc(100vh - 320px); min-height: calc(100vh - 320px); }
        }
    </style>
</head>
<body class="mode-gemini">
    <div class="page">
        <div class="topbar">
            <div class="brand">
                <!-- <h1>画图 / 视频</h1> -->
                <!-- <p>保留两个工作区的独立页面和主要流程，用一个更完整的首页壳层来承接切换、定位和日常使用。</p> -->
                <div class="workspace-meta">
                    <div class="meta-chip">Moai</div>
                    <div class="meta-chip">记得先获取模型列表奥~</div>
                    <div class="meta-chip">有问题请联系：Milo_wr</div>
                </div>                 
            </div>
            <div class="top-actions">
                <div class="status-pill">当前模式：<strong id="modeText">Gemini 画图</strong></div>
                <!-- <div class="status-pill">本地入口：<strong>localhost:7863</strong></div> -->
            </div>
        </div>
        <div class="hero-shell">
            <div class="hero-grid">
                <button class="switch-btn active" type="button" data-mode="gemini" aria-pressed="true">
                    <span class="eyebrow">Image Workspace</span>
                    <span class="title-row">
                        <span class="title">Gemini 画图</span>
                        <span class="badge">Image</span>
                    </span>
                    <!-- <span class="desc">保留你现有的图像工作流，继续用于文生图、图生图、多参考图和接口配置。</span> -->
                    <!-- <div class="subline">文生图 / 图生图 / 多参考图 / Session 隔离</div> -->
                </button>
                <button class="switch-btn" type="button" data-mode="grok" aria-pressed="false">
                    <span class="eyebrow">Video Workspace</span>
                    <span class="title-row">
                        <span class="title">GROK 视频</span>
                        <span class="badge">Video</span>
                    </span>
                    <!-- <span class="desc">保留独立的视频页面，继续承载生成任务、进度查询和结果预览，不把两套风格硬揉到一个页面里。</span> -->
                    <!-- <div class="subline">视频生成 / 任务列表 / 查询进度 / 独立 Session</div> -->
                </button>
                <button class="switch-btn" type="button" data-mode="gpt" aria-pressed="false">
                    <span class="eyebrow">GPT Image Workspace</span>
                    <span class="title-row">
                        <span class="title">GPT生图</span>
                        <span class="badge">Image</span>
                    </span>
                </button>
            </div>
        </div>

        <div class="viewport">
            <iframe id="frame-gemini" class="frame active" src="/gemini-app" title="Gemini 画图"></iframe>
            <iframe id="frame-grok" class="frame" src="/grok-app" title="GROK 视频" loading="lazy"></iframe>
            <iframe id="frame-gpt" class="frame" src="/gpt-image-app" title="GPT生图" loading="lazy"></iframe>
            <div id="sweep" class="sweep"></div>
        </div>
        <!-- <div class="panel-note">这次改动只落在壳层和页面呈现细节上，核心接口与主要工作流保持不动。</div> -->
    </div>
    <script>
        const body = document.body;
        const buttons = document.querySelectorAll('.switch-btn');
        const modeText = document.getElementById('modeText');
        const frames = {
            gemini: document.getElementById('frame-gemini'),
            grok: document.getElementById('frame-grok'),
            gpt: document.getElementById('frame-gpt')
        };
        const sweep = document.getElementById('sweep');
        const modeLabels = { gemini: 'Gemini 画图', grok: 'GROK 视频', gpt: 'GPT生图' };
        function activate(mode) {
            buttons.forEach(btn => {
                const active = btn.dataset.mode === mode;
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-pressed', active ? 'true' : 'false');
            });
            Object.entries(frames).forEach(([key, frame]) => frame.classList.toggle('active', key === mode));
            body.classList.toggle('mode-grok', mode === 'grok');
            body.classList.toggle('mode-gpt', mode === 'gpt');
            modeText.textContent = modeLabels[mode] || mode;
            sweep.classList.remove('run'); void sweep.offsetWidth; sweep.classList.add('run');
        }
        buttons.forEach(btn => btn.addEventListener('click', () => activate(btn.dataset.mode)));
    </script>
</body>
</html>
